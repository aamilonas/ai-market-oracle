name: Morning — Generate Predictions

on:
  schedule:
    # 10:07 UTC = 6:07 AM EDT / 5:07 AM EST. Scheduled early and off the
    # top of the hour because GitHub delays busy cron slots by hours.
    # Late runs are still scored fairly: the live price at prediction time
    # is the baseline.
    - cron: '7 10 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to generate predictions for (YYYY-MM-DD, default: today)'
        required: false
      models:
        description: 'Comma-separated model slugs from models.json (default: all active)'
        required: false
      overwrite:
        description: 'Overwrite existing prediction files for the selected date'
        required: false
        type: boolean
      dry_run:
        description: 'Call the models and show results without saving or committing'
        required: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Generate predictions
        id: generate
        working-directory: scripts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          MODELS="${{ github.event.inputs.models || '' }}"
          ARGS=""
          if [ -n "$DATE" ]; then ARGS="$ARGS --date $DATE"; fi
          if [ -n "$MODELS" ]; then ARGS="$ARGS --models $MODELS"; fi
          if [ "${{ github.event.inputs.overwrite || 'false' }}" = "true" ]; then ARGS="$ARGS --overwrite"; fi
          if [ "${{ github.event.inputs.dry_run || 'false' }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python generate.py $ARGS

      - name: Generate daily summary
        id: daily_summary
        if: github.event.inputs.dry_run != 'true'
        continue-on-error: true
        working-directory: scripts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          ARGS=""
          if [ -n "$DATE" ]; then ARGS="--date $DATE"; fi
          python summarize.py --daily $ARGS

      - name: Update leaderboard participation
        if: github.event.inputs.dry_run != 'true'
        run: python -c "import sys; sys.path.insert(0, 'scripts'); from score import update_leaderboard; update_leaderboard()"

      - name: Sync data to public
        run: rm -rf public/data && cp -r data public/data

      - name: Build frontend
        run: npm run build

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "AI Market Oracle Bot"
          git config user.email "bot@ai-market-oracle.github.io"
          git add data/ public/data/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "🤖 Morning predictions — $(date +%Y-%m-%d)"
          git pull --rebase origin master
          git push origin master

      - name: Health check — fail if generation or summary failed
        if: always()
        run: |
          ERRORS=""
          FAILED="${{ steps.generate.outputs.failed_models }}"
          if [ -n "$FAILED" ]; then
            ERRORS="${ERRORS}Models failed to generate predictions: $FAILED. "
          fi
          if [ "${{ steps.daily_summary.conclusion }}" = "failure" ]; then
            ERRORS="${ERRORS}Daily summary step failed. "
          fi
          if [ -n "$ERRORS" ]; then
            echo "::error::${ERRORS}Check logs above for details."
            exit 1
          fi
          echo "All morning steps completed successfully."
